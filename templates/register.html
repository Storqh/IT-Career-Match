{% extends "base.html" %}

{% block title %}
Đăng ký - IT Career Match
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Tạo tài khoản
                        </h2>

                        <p class="text-muted">
                            Bắt đầu hành trình nghề nghiệp IT của bạn.
                        </p>

                    </div>


                    {% if message %}

                    <div class="alert alert-{{ message_type|default('danger') }}
                                alert-dismissible fade show">

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                    {% endif %}


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Họ và tên
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control form-control-lg"
                                value="{{ full_name|default('') }}"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control form-control-lg"
                                value="{{ email|default('') }}"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Mật khẩu
                            </label>

                            <div class="input-group">

                                <input
                                    id="password"
                                    type="password"
                                    name="password"
                                    class="form-control form-control-lg"
                                    minlength="6"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('password', this)">
                                    Hiện
                                </button>

                            </div>

                            <small class="text-muted">
                                Tối thiểu 6 ký tự
                            </small>

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Xác nhận mật khẩu
                            </label>

                            <div class="input-group">

                                <input
                                    id="confirmPassword"
                                    type="password"
                                    name="confirm_password"
                                    class="form-control form-control-lg"
                                    required>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword('confirmPassword', this)">
                                    Hiện
                                </button>

                            </div>

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg">

                                Đăng ký & Gửi OTP

                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Đã có tài khoản?
                        </span>

                        <a
                            href="{{ url_for('login') }}"
                            class="text-decoration-none fw-semibold">

                            Đăng nhập

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        button.innerText = "Ẩn";

    } else {

        input.type = "password";
        button.innerText = "Hiện";

    }

}

</script>

{% endblock %}
