{% extends "base.html" %}

{% block title %}
Đăng ký - IT Career Match
{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Tạo tài khoản</h2>

                        <p class="text-muted">
                            Bắt đầu tìm công việc IT phù hợp với bạn.
                        </p>
                    </div>

                    {% if message %}
                    <div class="alert alert-info">
                        {{ message }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Họ và tên
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                Mật khẩu
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100">

                            Đăng ký

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Đã có tài khoản?
                        </span>

                        <a href="{{ url_for('login') }}">
                            Đăng nhập
                        </a>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
