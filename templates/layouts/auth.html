{% extends "base.html" %}

{% block body_class %}auth-layout{% endblock %}

{% block body_content %}
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-logo" aria-hidden="true">
            <i class="bi bi-briefcase-fill"></i>
        </div>
        <h1 class="auth-title">{{ self.auth_title() }}</h1>
        <p class="auth-subtitle">{{ self.auth_subtitle() }}</p>
    </div>

    <div class="auth-body">
        {% block auth_content %}{% endblock %}
    </div>

    <div class="auth-footer">
        <p class="auth-footer-text">{{ self.auth_footer() }}</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{{ super() }}
{% endblock %}
