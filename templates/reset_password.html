{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu - IT Career Match{% endblock %}

{% block content %}
<div class="container py-5 auth-page">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="auth-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></div>
                    <h1 class="h3 fw-bold text-center mb-4">Đặt lại mật khẩu</h1>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endwith %}
                    <form method="POST" data-loading-form>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required minlength="8" autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirm_password"
                                   name="confirm_password" data-password-confirm="password"
                                   required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cập nhật mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
