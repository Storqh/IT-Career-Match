{% extends "base.html" %}

{% block title %}500 - Lỗi máy chủ - IT Career Match{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4" style="font-size: 8rem; color: #dee2e6;">500</div>
            <h1 class="h2 fw-bold mb-3">Lỗi máy chủ nội bộ</h1>
            <p class="text-muted mb-4">Đã có lỗi xảy ra ở phía máy chủ. Chúng tôi đã được thông báo và sẽ khắc phục sớm nhất.</p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="{{ url_for('jobs.list_jobs') }}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i>Về trang chủ
                </a>
                <button class="btn btn-outline-secondary" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise me-1"></i>Thử lại
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
