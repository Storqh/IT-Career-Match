
<!-- =========================================
     IT CAREER MATCH - CHATBOT
========================================= -->

<div id="careerChatbot" class="career-chatbot">

    <!-- Nút mở chatbot -->
    <button
        type="button"
        id="chatbotToggle"
        class="chatbot-toggle"
        aria-label="Mở chatbot tư vấn nghề nghiệp"
        aria-expanded="false"
        aria-controls="chatbotWindow"
    >
        <i class="bi bi-chat-dots-fill"></i>
    </button>

    <!-- Cửa sổ chatbot -->
    <section
        id="chatbotWindow"
        class="chatbot-window"
        aria-label="Chatbot tư vấn nghề nghiệp"
        hidden
    >

        <!-- 1. HEADER -->
        <header class="chatbot-header">

            <!-- Cụm bên trái: Avatar + Tiêu đề -->
            <div class="chatbot-header-left">
                <div class="chatbot-avatar">
                    <i class="bi bi-robot"></i>
                </div>
                <div class="chatbot-header-text">
                    <strong>IT Career Assistant</strong>
                    <span class="chatbot-header-subtitle">
                        <span class="chatbot-online-dot" aria-hidden="true"></span>
                        Trợ lý hướng nghiệp IT
                    </span>
                </div>
            </div>

            <!-- Cụm bên phải: Nút đóng -->
            <button
                type="button"
                id="chatbotClose"
                class="chatbot-close"
                aria-label="Đóng chatbot"
            >
                <i class="bi bi-x-lg"></i>
            </button>

        </header>

        <!-- 2. KHU VỰC TIN NHẮN -->
        <div
            id="chatbotMessages"
            class="chatbot-messages"
            role="log"
            aria-live="polite"
            aria-relevant="additions"
        >

            <!-- Lời chào ban đầu -->
            <div class="chatbot-message bot">

                <div class="chatbot-message-avatar">
                    <i class="bi bi-robot"></i>
                </div>

                <div class="chatbot-bubble">
                    <strong>Xin chào! 👋</strong>
                    <p>Mình là trợ lý hướng nghiệp của IT Career Match.</p>
                    <p>Mình có thể hỗ trợ bạn về CV, kỹ năng IT, lộ trình học tập và định hướng nghề nghiệp.</p>
                    <p>Bạn muốn tìm hiểu điều gì hôm nay?</p>
                </div>

            </div>

        </div>

        <!-- 3. CÂU HỎI GỢI Ý -->
        <div
            id="chatbotSuggestions"
            class="chatbot-suggestions"
        >

            <button
                type="button"
                class="chatbot-suggestion"
                data-question="Cách viết CV IT"
            >
                <i class="bi bi-file-earmark-person"></i>
                Viết CV IT
            </button>

            <button
                type="button"
                class="chatbot-suggestion"
                data-question="Lộ trình học Backend"
            >
                <i class="bi bi-code-slash"></i>
                Học Backend
            </button>

            <button
                type="button"
                class="chatbot-suggestion"
                data-question="Lộ trình học Machine Learning"
            >
                <i class="bi bi-cpu"></i>
                Học AI/ML
            </button>

            <button
                type="button"
                class="chatbot-suggestion"
                data-question="Cách chuẩn bị phỏng vấn IT"
            >
                <i class="bi bi-briefcase"></i>
                Phỏng vấn IT
            </button>

        </div>

        <!-- 4. Ô NHẬP TIN NHẮN -->
        <form
            id="chatbotForm"
            class="chatbot-input-area"
            autocomplete="off"
        >

            <label for="chatbotInput" class="visually-hidden">Nhập câu hỏi của bạn</label>
            <input
                type="text"
                id="chatbotInput"
                class="chatbot-input"
                placeholder="Nhập câu hỏi của bạn..."
                maxlength="500"
                required
            >

            <button
                type="submit"
                id="chatbotSend"
                class="chatbot-send"
                aria-label="Gửi tin nhắn"
            >
                <i class="bi bi-send-fill"></i>
            </button>

        </form>

        <!-- 5. FOOTER -->
        <footer class="chatbot-footer">
            IT Career Match · Career Support
        </footer>

    </section>

</div>
