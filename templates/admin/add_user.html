{% extends "base.html" %}

{% block title %}Thêm người dùng{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <a
                href="{{ url_for('admin_users') }}"
                class="btn btn-outline-secondary mb-4"
            >
                ← Quay lại
            </a>

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        Thêm tài khoản
                    </h2>

                    {% if message %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Họ và tên
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mật khẩu
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                minlength="6"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Ngành học
                            </label>

                            <input
                                type="text"
                                name="major"
                                class="form-control"
                                placeholder="Công nghệ thông tin"
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Role
                            </label>

                            <select
                                name="role"
                                class="form-select"
                            >

                                <option value="student">
                                    Student
                                </option>

                                <option value="admin">
                                    Admin
                                </option>

                            </select>

                        </div>

                        <button
                            class="btn btn-primary w-100"
                        >
                            Tạo tài khoản
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
