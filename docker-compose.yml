services:
  postgres:
    image: postgres:16
    container_name: it-career-match-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: it_career_match
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_career_match"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: